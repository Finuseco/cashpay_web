<h1 style="font-size: 24px; color: #000E38; margin-top: 0;">Nouveau Message</h1>
<p style="margin:0; color: #495057;">Vous avez reçu un nouveau message de <strong>{{senderName}}</strong>.</p>

<table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-top: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #dee2e6;">
    <!-- Section Expéditeur -->
    <tr style="background-color: #000E38;">
        <td style="padding: 20px;">
            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                    <td width="50" valign="middle">
                        <img src="{{senderProfilePicture}}" alt="{{senderName}}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #ffffff;">
                    </td>
                    <td valign="middle" style="padding-left: 15px;">
                        <p style="font-weight: bold; margin: 0; color: #ffffff;">{{senderName}}</p>
                        <p style="font-size: 12px; color: #adb5bd; margin: 4px 0 0 0;">{{timestamp}}</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <!-- Section Message -->
    <tr>
        <td style="padding: 20px; background-color: #f8f9fa;">
            <p style="margin: 0; color: #4a5568; line-height: 1.6;">{{messageContent}}</p>
        </td>
    </tr>
</table>

<table width="100%" border="0" cellspacing="0" cellpadding="0">
    <tr>
        <td align="center" style="padding-top: 20px;">
            <a href="{{replyLink}}" class="button" style="background-color: #FF6600; color: #ffffff !important; padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; display: inline-block;">Répondre dans OnChat</a>
        </td>
    </tr>
</table>
