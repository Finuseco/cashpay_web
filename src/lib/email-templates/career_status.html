<h1>{{title}}</h1>
<p>Bonjour {{firstName}},</p>
<p>{{message}}</p>
<table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e6dcf0;border-radius:10px;border-collapse:separate;font-size:14px;margin:18px 0">
  <tr><td style="padding:10px 14px;background:#faf7fd;width:38%;color:#6b5a82"><b>Référence</b></td><td style="padding:10px 14px">{{ref}}</td></tr>
  <tr><td style="padding:10px 14px;background:#faf7fd;color:#6b5a82;border-top:1px solid #e6dcf0"><b>Poste</b></td><td style="padding:10px 14px;border-top:1px solid #e6dcf0">{{position}}</td></tr>
  <tr><td style="padding:10px 14px;background:#faf7fd;color:#6b5a82;border-top:1px solid #e6dcf0"><b>Statut</b></td><td style="padding:10px 14px;border-top:1px solid #e6dcf0">{{statusLabel}}</td></tr>
</table>
<p style="font-size:13px;color:#6b5a82">Pour toute question, écrivez à <a href="mailto:info@cashpay-all.com" style="color:#7a22d4">info@cashpay-all.com</a> en indiquant votre référence.</p>
<p>L'équipe CashPay All</p>
